name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Single place the Godot version is pinned; keep equal to README / project.godot (4.6).
  GODOT_VERSION: 4.6.2-stable

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Import, tests and headless checks
        run: |
          export GODOT="$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --version
          tools/ci/run_ci.sh "$GITHUB_WORKSPACE/ci-logs"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
