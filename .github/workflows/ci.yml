name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Single place the Godot version is pinned; keep equal to README / project.godot (4.6).
  GODOT_VERSION: 4.6.2-stable

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sharded (#194): one serial job passed 10 min on a 4-vCPU runner (~6.5 min on a laptop, GH is
  # slower). Three shards (SHARD env, see tools/ci/run_ci.sh) each finish in ~4-5 min.
  test:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Import, tests and headless checks
        run: |
          export GODOT="$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --version
          SHARD="${{ matrix.shard }}" tools/ci/run_ci.sh "$GITHUB_WORKSPACE/ci-logs"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ strategy.job-index }}
          path: ci-logs/
